name: Quality
on: [push, pull_request]
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: readduniya_test
          MYSQL_ROOT_PASSWORD: test-only-password
        ports: [3306:3306]
        options: >-
          --health-cmd="mysqladmin ping -h localhost -ptest-only-password"
          --health-interval=5s --health-timeout=5s --health-retries=30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql, pdo_sqlite, dom, zip
          coverage: none
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: composer install --prefer-dist --no-interaction
      - run: vendor/bin/pint --test
      - run: php artisan test
      - name: MySQL integration suite
        run: php artisan test
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: readduniya_test
          DB_USERNAME: root
          DB_PASSWORD: test-only-password
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
